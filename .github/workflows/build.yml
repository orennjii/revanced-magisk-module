name: Build Morphe APKs

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '0 4 * * *'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner curl jq unzip zip

      - name: Run Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh scripts/*.sh
          ./build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: morphe-apks
          path: |
            build/*.apk
            build/build-info.json
          if-no-files-found: error

      - name: Prepare Release Metadata
        if: ${{ github.event_name == 'push' || github.event.inputs.create_release == 'true' || github.event.inputs.create_release == '' }}
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(date -u +'%Y%m%d.%H%M%S')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || github.event.inputs.create_release == 'true' || github.event.inputs.create_release == '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Morphe APKs ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          files: |
            build/*.apk
            build/build-info.json
