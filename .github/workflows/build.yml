name: Build Morphe APKs

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            curl \
            unzip \
            zip

      - name: Build APKs
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify outputs
        run: |
          set -e

          test -f build/YouTube-Morphe-*.apk
          test -f build/Music-Morphe-*.apk

          echo "Built APKs:"
          ls -lh build/

      - name: Generate release tag
        id: release
        run: |
          TAG="build-$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Release APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Morphe APKs ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            build/*.apk
